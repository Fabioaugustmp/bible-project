<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca Bíblica</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Aplica o tema salvo antes da primeira pintura.
    try {
      const theme = localStorage.getItem("theme");
      if (theme) document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <header class="bar">
    <nav class="nav" aria-label="Passagem">
      <select id="version" aria-label="Versão"></select>
      <button id="prev" class="icon" aria-label="Capítulo anterior" title="Capítulo anterior">‹</button>
      <select id="book" aria-label="Livro"></select>
      <select id="chapter" aria-label="Capítulo"></select>
      <button id="next" class="icon" aria-label="Próximo capítulo" title="Próximo capítulo">›</button>
    </nav>
    <form id="search" class="search" role="search">
      <input id="q" type="search" placeholder="Buscar palavra ou ir para Jo 3:16" autocomplete="off"
             aria-label="Buscar ou ir para referência">
    </form>
    <div class="tools">
      <button id="smaller" class="icon" aria-label="Diminuir fonte" title="Diminuir fonte">A−</button>
      <button id="larger" class="icon" aria-label="Aumentar fonte" title="Aumentar fonte">A+</button>
      <button id="marks" class="icon label" aria-pressed="true" title="Mostrar no texto os versículos com notas ou em estudos">Marcas</button>
      <button id="select" class="icon label" aria-pressed="false" title="Selecionar versículos: toque no primeiro e no último (Esc sai)">Selecionar</button>
    <button id="studies" class="icon label" title="Meus estudos">Estudos</button>
    <button id="reading" class="icon label" title="Leitura de hoje: planos de capítulos, marcados como lidos">Leitura</button>
    <button id="journal" class="icon label" title="Diário de estudo: reflexões com data, sem passagem">Diário</button>
    <button id="memo" class="icon label" title="Memorização: versículos revisados com intervalos crescentes (SM-2)">Memorizar</button>
    <button id="topics-notes" class="icon label" title="Notas por tópico: um assunto com notas de várias passagens (não é a busca por tema)">Tópicos</button>
    <button id="topics" class="icon label" title="Pesquisar um tema na Bíblia">Temas</button>
    <button id="browse" class="icon label" title="Folhear dicionários e livros">Dicionários</button>
      <button id="view" class="icon label" aria-haspopup="dialog" title="Exibir: paralelo, marcas, seleção, tema e atalhos, com as teclas">Exibir</button>
      <button id="parallel" class="icon label" aria-pressed="false" title="Versões em paralelo (atalho: p)">Paralelo</button>
      <button id="words" class="icon" aria-pressed="false" title="Palavras originais: clique em uma palavra para ver o termo grego ou hebraico" hidden>Strong</button>
      <button id="theme" class="icon label" aria-label="Alternar tema claro e escuro" title="Alternar tema claro e escuro">Tema</button>
    </div>
  </header>

  <div class="layout">
    <main id="reader" class="reader" tabindex="-1">
      <div id="resume" class="resume" role="region" aria-label="Continuar de onde parou" hidden></div>
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <div id="text" class="text"></div>
      <p id="hint" class="hint">Clique em um versículo para ver versões, comentários e citações.</p>
      <div id="selbar" class="selbar" role="toolbar" aria-label="Ações da seleção" hidden></div>
    </main>

    <div id="split-panel" class="splitter" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Largura do painel de estudo (setas ajustam)" hidden></div>
    <aside id="panel" class="panel" aria-label="Estudo" hidden>
      <div class="panel-head">
        <h2 id="panel-title"></h2>
        <button id="show-pins" class="chip pins-switch" hidden></button>
        <button id="panel-pin" class="icon" title="Fixar numa coluna ao lado" aria-label="Fixar numa coluna ao lado">Fixar</button>
        <button id="panel-close" class="icon" aria-label="Fechar painel">×</button>
      </div>
      <div id="panel-body" class="panel-body"></div>
    </aside>

    <div id="split-pinned" class="splitter" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Largura da coluna fixada (setas ajustam)" hidden></div>
    <aside id="pinned" class="panel pinned" aria-label="Itens fixados" hidden>
      <div class="panel-head pinned-head">
        <div id="pin-tabs" class="pin-tabs" role="tablist" aria-label="Itens fixados"></div>
      </div>
      <div id="pinned-body" class="panel-body"></div>
    </aside>
  </div>

  <div id="preview" class="preview" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="alert" hidden></div>
  <div id="studies-full" class="graph-full" role="dialog" aria-modal="true" aria-label="Meus estudos" hidden>
    <div class="graph-full-head"><strong>Meus estudos</strong><button id="studies-close" class="chip" aria-label="Fechar meus estudos">Fechar · Esc</button></div>
    <div id="studies-body" class="topic-body"></div>
  </div>
  <div id="topic-full" class="graph-full topic-full" role="dialog" aria-modal="true" aria-label="Pesquisa por tema" hidden>
    <div class="graph-full-head"><strong>Pesquisa por tema</strong><button id="topic-close" class="chip" aria-label="Fechar pesquisa por tema">Fechar · Esc</button></div>
    <form id="topic-form" class="topic-form">
      <input id="topic-q" type="search" placeholder="Ex.: ansiedade, perdão, paz" autocomplete="off" aria-label="Tema">
      <button class="chip on" type="submit">Pesquisar</button>
    </form>
    <div id="topic-body" class="topic-body"></div>
  </div>
  <div id="graph-full" class="graph-full" role="dialog" aria-modal="true" aria-label="Grafo de referências" hidden>
    <div class="graph-full-head">
      <div><strong id="graph-full-title">Referências</strong></div>
      <button id="graph-full-close" class="chip" aria-label="Fechar grafo">Fechar · Esc</button>
    </div>
    <div id="graph-full-body" class="graph-full-body"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
