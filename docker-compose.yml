# Biblioteca Bíblica em contêineres. Ver DEPLOY.md.
#
#   docker compose up -d --build web                      # leitura, estudo e busca por palavra
#   docker compose --profile semantic up -d --build       # + busca por sentido e "Parecidas"
#
# Valor sensível (código de acesso) fica em .env, fora do git (ver .env.example).
# O túnel da Cloudflare já existe no servidor (contêiner cloudflared-default, rede general-network).
# A pasta ./data do host é montada em /data: library.db, user.db, embeddings.db, hf-cache/ e o código.
# Nada disso entra na imagem (módulos têm direito autoral, D007).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: biblioteca-web:local
    container_name: biblioteca-web      # nome que o túnel usa: http://biblioteca-web:8377
    networks:
      - default
      - general-network
    ports:
      # Publicado só na própria máquina (o túnel chega pelo nome, na general-network).
      # Contingência sem DNS: BIBLE_HOST_BIND=<gateway da general-network> no .env (DEPLOY.md).
      - "${BIBLE_HOST_BIND:-127.0.0.1}:8377:8377"
    volumes:
      - ./data:/data
    environment:
      BIBLE_EMBED_URL: http://embed:8378   # sem o perfil "semantic", a busca por sentido avisa e a busca por palavra continua
      # Publicação (D034). Vazio = uso local, sem código. Com endereço, todo pedido exige o código.
      BIBLE_PUBLIC_ORIGIN: ${BIBLE_PUBLIC_ORIGIN:-}
      BIBLE_ACCESS_TOKEN: ${BIBLE_ACCESS_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  embed:
    build:
      context: .
      dockerfile: Dockerfile.embed
    image: biblioteca-embed:local
    profiles: ["semantic"]
    mem_limit: 3g                   # teto de memória medido no experimento (fp32: pico de 2,46 GB; ver docs/EXPERIMENTO-MEMORIA-EMBED.md)
    volumes:
      - ./data:/data
    expose:
      - "8378"                       # só na rede interna do compose; não é publicado
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  general-network:
    external: true     # rede do túnel da Cloudflare (cloudflared-default); deve existir no servidor
